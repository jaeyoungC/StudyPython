<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>할 일</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 40rem; margin: 2rem auto; padding: 0 1rem; line-height: 1.5; }
    form { display: flex; gap: .5rem; flex-wrap: wrap; align-items: end; margin-bottom: 1rem; }
    label { display: flex; flex-direction: column; font-size: .9rem; }
    input { padding: .4rem; font: inherit; }
    button { padding: .45rem .8rem; font: inherit; cursor: pointer; }
    button:focus-visible, input:focus-visible { outline: 3px solid #2563eb; outline-offset: 2px; }
    ul { list-style: none; padding: 0; }
    li { display: flex; gap: .5rem; align-items: center; padding: .4rem 0; border-bottom: 1px solid #ddd; }
    li.done .title { text-decoration: line-through; color: #666; }
    .title { flex: 1; }
    [role="status"] { min-height: 1.5rem; color: #b91c1c; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <h1>할 일</h1>

  <!-- TODO: 오류·안내 문구를 보여 줄 <p id="status">. 화면 낭독기가 바뀐 내용을 읽어 주도록 role="status" aria-live="polite" 를 붙인다 -->

  <section id="auth-section" aria-labelledby="auth-heading">
    <h2 id="auth-heading">로그인</h2>
    <form id="auth-form">
      <!-- TODO: 입력 두 개(id="username", id="password" type="password")에 각각 <label for=...> 를 붙인다.
           라벨을 클릭하면 입력에 포커스가 가고, 화면 낭독기가 "사용자 이름, 편집 가능" 이라고 읽는다. placeholder 는 라벨이 아니다. -->
      <input id="username" name="username" autocomplete="username" required>
      <input id="password" name="password" type="password" autocomplete="current-password" minlength="8" required>
      <!-- TODO: 로그인 버튼은 type="submit" (Enter 키로도 동작), 가입 버튼(id="register-button")은 type="button" (폼을 보내면 안 되므로) -->
      <button>로그인</button>
      <button id="register-button">가입</button>
    </form>
  </section>

  <section id="tasks-section" class="hidden" aria-labelledby="tasks-heading">
    <h2 id="tasks-heading">목록</h2>
    <form id="add-form">
      <!-- TODO: id="title" 입력에 라벨 "새 할 일", 추가 버튼은 type="submit" -->
      <input id="title" name="title" maxlength="200" required>
      <button>추가</button>
      <label for="filter">보기
        <select id="filter" name="filter">
          <option value="all">전체</option>
          <option value="open">미완료</option>
          <option value="done">완료</option>
        </select>
      </label>
      <button type="button" id="logout-button">로그아웃</button>
    </form>
    <!-- TODO: 목록에 aria-label="할 일 목록" -->
    <ul id="task-list"></ul>
  </section>

  <script src="app.js"></script>
</body>
</html>
